name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  # Manual trigger, from the Actions tab or `gh workflow run deploy.yml`.
  # A push event Actions never receives — during an Actions outage, say —
  # creates no run, and one is not backfilled once the incident clears, so
  # main sits deployed-behind with no way to retry short of an empty commit.
  # Dispatch redeploys the selected ref: `github.sha` resolves to that ref's
  # head, so the image tags and the deployed revision line up exactly as they
  # do on a push.
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  # Cloud Run service was renamed in the awards/survey nomenclature cleanup.
  # Artifact Registry repo name (awards-production) was kept as-is to preserve
  # the existing image — see terraform/main.tf comment on `name_prefix`.
  SERVICE: ucd-production-frontend
  IMAGE: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/awards-production/frontend

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build Docker image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }} \
            --build-arg NEXT_PUBLIC_GCS_BUCKET=${{ secrets.GCS_BUCKET }} \
            --build-arg GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }} \
            --build-arg PUBLIC_ASSETS_BUCKET=${{ secrets.PUBLIC_ASSETS_BUCKET }} \
            -t ${{ env.IMAGE }}:latest \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            frontend/

      - name: Push Docker image
        run: |
          docker push ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
