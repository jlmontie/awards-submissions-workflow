name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Match the processors' Cloud Functions runtime (terraform/functions.tf).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: |
          pip install \
            -r backend/pdf-processor/requirements.txt \
            -r backend/photo-processor/requirements.txt \
            pytest
      - run: pytest backend/tests
